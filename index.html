<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sturix</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#030712">
<style>
:root{--bg:#030712;--cyan:#00f2fe;--muted:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:Tahoma,sans-serif;min-height:100vh}
button,input,select,textarea{font-family:inherit}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;background:var(--bg) url('./images/welcome.jpg') center/cover no-repeat;transition:opacity .5s}
#splash::before{content:"";position:absolute;inset:0;background:rgba(3,7,18,.9)}
#splash>*{position:relative}
#splash.hide{opacity:0;pointer-events:none}
.logo{width:112px;height:112px;border-radius:30px;border:1px solid rgba(0,242,254,.6);padding:12px;background:#081226;object-fit:contain}
.s-title{font-size:48px;font-weight:900;letter-spacing:4px;color:var(--cyan);margin:24px 0 8px;text-shadow:0 0 18px rgba(0,242,254,.6)}
.s-sub{color:#a8b6ce;font-size:14px;margin:4px 0}
.start{margin-top:36px;width:min(260px,100%);min-height:52px;border:none;border-radius:16px;background:linear-gradient(100deg,#00f2fe,#a78bfa);color:#030712;font:bold 17px Tahoma;cursor:pointer}
#home{display:none;max-width:480px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px;font-weight:900;color:var(--cyan);margin-top:8px}
.brand img{width:44px;height:44px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.card{min-height:140px;border-radius:22px;padding:16px;cursor:pointer;background:linear-gradient(145deg,#071a35,#080d20);border:1.5px solid var(--c);box-shadow:0 0 14px var(--c);display:flex;flex-direction:column;justify-content:space-between}
.card .ic{font-size:40px}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card small{color:#77baff;font-size:12px}
.card.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:14px;min-height:90px}
#tool{display:none;max-width:480px;margin:0 auto;padding:16px}
.panel{background:#090e1a;border:1.5px solid var(--cyan);border-radius:20px;padding:20px}
.back{background:#111827;border:1px solid #334155;color:var(--cyan);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:bold;margin-bottom:14px}
h2{margin:0 0 14px}
.inp{width:100%;padding:12px;background:#030712;color:#fff;border:1px solid #1e293b;border-radius:10px;font-size:15px;margin-bottom:10px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--cyan);color:#030712;font-weight:bold;font-size:15px;cursor:pointer;margin-top:4px}
.muted{color:var(--muted);font-size:13px}
.res{margin-top:12px;padding:12px;border-radius:10px;background:#030712;color:var(--cyan);min-height:40px;white-space:pre-wrap;word-break:break-word}
.list{padding:0;margin:14px 0 0;list-style:none}
.list li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1e293b}
#camBox{display:none;position:fixed;inset:0;z-index:200;background:#000;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#camVideo{width:100%;max-height:65vh;object-fit:cover;border-radius:16px}
#camMsg{color:#fff;margin:16px 0;text-align:center;font-size:16px;word-break:break-all}
.disp{width:100%;height:96px;background:#030712;border:1px solid #1e293b;border-radius:16px;color:var(--cyan);font-size:44px;direction:ltr;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;overflow:hidden;margin-bottom:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{height:76px;border:none;border-radius:16px;background:#1e293b;color:#fff;font-size:28px;cursor:pointer}
.keys .op{background:#334155;color:var(--cyan)}
.keys .clr{background:#ef4444}
.keys .z{grid-column:span 2}
.keys .eq{background:#f97316;color:#fff}
.chat{height:300px;overflow-y:auto;background:#030712;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.bub{max-width:85%;padding:9px 12px;border-radius:10px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.bot{align-self:flex-start;background:#111d2e;color:var(--cyan)}
.me{align-self:flex-end;background:#1a2a42;color:#fff}
.row{display:flex;gap:8px;align-items:center}
.send{width:46px;height:46px;border:none;border-radius:10px;background:var(--cyan);color:#030712;font-size:18px;cursor:pointer}
</style>
</head>
<body>

<div id="splash">
  <img class="logo" src="./images/icon.png" alt="Sturix">
  <div class="s-title">STURIX</div>
  <p class="s-sub">صندوق الأدوات الذكي والشامل</p>
  <p class="s-sub">تقنية متطورة. أدواتك في مكان واحد.</p>
  <button class="start" onclick="startApp()">ابدأ الآن ←</button>
</div>

<div id="home">
  <div class="brand"><img src="./images/icon.png" alt="">Sturix</div>
  <p class="muted" style="text-align:center;margin:6px 0 0">صندوق الأدوات الذكي والشامل</p>
  <div class="grid" id="grid"></div>
</div>

<div id="tool">
  <button class="back" onclick="goHome()">← العودة</button>
  <div class="panel" id="content"></div>
</div>

<div id="camBox">
  <video id="camVideo" playsinline muted></video>
  <div id="camMsg"></div>
  <button class="back" onclick="closeCam()">✕ إغلاق الكاميرا</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const TOOLS = [
  ['pdf','📄','صور إلى PDF','تحويل الصور لملف PDF','#ff376d'],
  ['files','📁','مدير الملفات','استعراض ملفات الهاتف','#168bff'],
  ['qr','📷','منشئ QR Code','توليد وفحص الباركود','#168bff'],
  ['net','📶','معلومات الشبكة','حالة الاتصال ونوعه','#ff9d22'],
  ['themes','🎨','ثيمات التطبيق','تغيير ألوان المظهر','#a735ff'],
  ['flash','🔦','المصباح اليدوي','فلاش الكاميرا','#168bff'],
  ['todo','📝','قائمة المهام','تنظيم المهام اليومية','#168bff'],
  ['pass','🔐','كلمات المرور','كلمات مرور قوية وآمنة','#ff9d22'],
  ['notes','📓','ملاحظات سريعة','حفظ الأفكار محلياً','#a735ff'],
  ['calc','🧮','الآلة الحاسبة','حسابات دقيقة وفورية','#ff24b8'],
  ['speed','🌐','سرعة الإنترنت','اختبار سرعة الاتصال','#168bff'],
  ['dev','🔢','أدوات المطورين','JSON و Base64','#a735ff'],
  ['scan','🛡️','فاحص الروابط','فحص أولي للروابط','#168bff'],
  ['trans','🌍','مترجم النصوص','ترجمة حقيقية للنصوص','#a735ff'],
  ['ai','🤖','Sturix AI','مساعد الذكاء الاصطناعي','#ff247b', true]
];

const KEYS = [['C','⌫','%','÷'],['7','8','9','×'],['4','5','6','−'],['1','2','3','+'],['0','.','=']];
const OPS = ['÷','×','−','+','%'];

const VIEWS = {
  pdf: { html: `<h2>صور إلى PDF</h2><p class="muted">التحويل الفعلي إلى PDF قيد التطوير.</p><input type="file" accept="image/*" class="inp">` },
  files: { html: `<h2>مدير الملفات</h2><input type="file" multiple class="inp" onchange="$('fl').innerHTML=[...this.files].map(f=>'<div>'+esc(f.name)+'</div>').join('')"><div id="fl" class="muted"></div>` },
  qr: { html: `<h2>منشئ QR Code</h2>
    <input id="qval" class="inp" placeholder="اكتب النص هنا...">
    <button class="btn" onclick="$('qres').textContent='النص: '+$('qval').value">إنشاء</button>
    <div id="qres" class="res"></div>
    <button class="btn" style="margin-top:16px;background:#111827;color:#00f2fe;border:1px solid #00f2fe" onclick="openCam()">📷 فتح الكاميرا لمسح الكود</button>` },
  net: { html: `<h2>معلومات الشبكة</h2><p>الحالة: <span id="nOn"></span></p><p>نوع الاتصال: <span id="nType"></span></p>`,
    init() {
      $('nOn').textContent = navigator.onLine ? 'متصل' : 'غير متصل';
      $('nType').textContent = navigator.connection ? navigator.connection.effectiveType : 'غير متاح في هذا المتصفح';
    } },
  themes: { html: `<h2>ثيمات التطبيق</h2><p class="muted">الثيم الحالي: النيون. تبديل الثيمات قادم لاحقاً.</p>` },
  flash: { html: `<h2>المصباح اليدوي</h2><button class="btn" id="flashBtn" onclick="toggleFlash()">تشغيل الفلاش</button>` },
  todo: { html: `<h2>قائمة المهام</h2>
    <input id="td" class="inp" placeholder="مهمة جديدة..." onkeydown="if(event.key==='Enter')addTodo()">
    <button class="btn" onclick="addTodo()">إضافة</button><ul class="list" id="tdl"></ul>`,
    init: renderTodos },
  pass: { html: `<h2>مولد كلمات المرور</h2><input id="pval" class="inp" readonly><button class="btn" onclick="genPass()">توليد</button>`,
    init: genPass },
  notes: { html: `<h2>ملاحظات سريعة</h2><textarea id="nTxt" class="inp" style="height:140px"></textarea><button class="btn" onclick="saveNote()">حفظ</button><div id="nMsg" class="muted"></div>`,
    init() { $('nTxt').value = localStorage.getItem('sturix_note') || ''; } },
  calc: { html: `<h2>الآلة الحاسبة</h2><div class="disp" id="disp">0</div><div class="keys">${calcKeys()}</div>` },
  speed: { html: `<h2>سرعة الإنترنت</h2><p class="muted">هذه الميزة قيد التطوير حالياً.</p>` },
  dev: { html: `<h2>أدوات المطورين</h2><textarea id="dIn" class="inp" style="height:110px" placeholder="الصق النص هنا..."></textarea>
    <div class="row"><button class="btn" onclick="devRun('json')">JSON تنسيق</button><button class="btn" onclick="devRun('enc')">Base64 ترميز</button><button class="btn" onclick="devRun('dec')">Base64 فك</button></div>
    <div id="dOut" class="res"></div>` },
  scan: { html: `<h2>فاحص الروابط</h2><input id="sIn" class="inp" placeholder="https://..."><button class="btn" onclick="scanLink()">فحص</button><div id="sOut" class="res"></div>` },
  trans: { html: `<h2>مترجم النصوص</h2>
    <select id="tPair" class="inp"><option value="ar|en">العربية ← الإنجليزية</option><option value="en|ar">الإنجليزية ← العربية</option><option value="ar|fr">العربية ← الفرنسية</option></select>
    <textarea id="tIn" class="inp" style="height:110px" placeholder="اكتب النص هنا..."></textarea>
    <button class="btn" onclick="translate()">ترجمة</button><div id="tOut" class="res"></div>` },
  ai: { html: `<h2>Sturix AI</h2>
    <div id="cbox" class="chat"><div class="bub bot">مرحباً! أنا Sturix AI، كيف أساعدك؟</div></div>
    <div class="row"><input id="cinput" class="inp" style="margin:0;flex:1" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')smsg()"><button class="send" onclick="smsg()">➤</button></div>` }
};

function calcKeys() {
  return KEYS.map(row => row.map(k => {
    let c = '';
    if (k === '0') c += ' z';
    if (k === '=') c += ' eq';
    if (OPS.includes(k)) c += ' op';
    if (k === 'C' || k === '⌫') c += ' clr';
    return `<button class="${c.trim()}" onclick="ck('${k}')">${k}</button>`;
  }).join('')).join('');
}

function ck(k) {
  if (k === 'C') cexpr = '';
  else if (k === '⌫') cexpr = cexpr.slice(0, -1);
  else if (k === '=') {
    try {
      const s = cexpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
      if (!/^[0-9+\-*\/.() ]+$/.test(s)) throw 0;
      const r = Function('"use strict";return (' + s + ')')();
      cexpr = Number.isFinite(r) ? String(Math.round(r * 1e10) / 1e10) : 'خطأ';
    } catch (e) { cexpr = 'خطأ'; }
  } else {
    if (cexpr === 'خطأ') cexpr = '';
    cexpr += k;
  }
  $('disp').textContent = cexpr || '0';
}
let cexpr = '';

let todos = [];
function addTodo() {
  const v = $('td').value.trim();
  if (!v) return;
  todos.unshift({ t: v, d: false });
  $('td').value = '';
  renderTodos();
}
function renderTodos() {
  $('tdl').innerHTML = todos.map((x, i) =>
    `<li><span onclick="todos[${i}].d=!todos[${i}].d;renderTodos()" style="flex:1;cursor:pointer;${x.d ? 'text-decoration:line-through;color:#94a3b8' : ''}">${esc(x.t)}</span><button onclick="todos.splice(${i},1);renderTodos()" style="background:none;border:none;color:#f87171;font-size:18px">✕</button></li>`
  ).join('');
}

function genPass() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#$%';
  const a = new Uint32Array(16);
  crypto.getRandomValues(a);
  $('pval').value = Array.from(a, x => c[x % c.length]).join('');
}

function saveNote() {
  try { localStorage.setItem('sturix_note', $('nTxt').value); $('nMsg').textContent = 'تم الحفظ'; }
  catch (e) { $('nMsg').textContent = 'تعذر الحفظ'; }
}

function devRun(m) {
  const t = $('dIn').value;
  let o;
  try {
    if (m === 'json') o = JSON.stringify(JSON.parse(t), null, 2);
    else if (m === 'enc') o = btoa(unescape(encodeURIComponent(t)));
    else o = decodeURIComponent(escape(atob(t.trim())));
  } catch (e) { o = 'خطأ: المدخل غير صالح'; }
  $('dOut').textContent = o;
}

function scanLink() {
  let m;
  try {
    const u = new URL($('sIn').value.trim());
    m = u.protocol !== 'https:' ? 'تحذير: الرابط غير مشفّر (http)' : 'الصيغة سليمة ويستخدم https. هذا فحص أولي فقط ولا يضمن الأمان الكامل.';
  } catch (e) { m = 'الرابط غير صالح، تأكد من كتابة https://'; }
  $('sOut').textContent = m;
}

async function translate() {
  const txt = $('tIn').value.trim();
  const out = $('tOut');
  if (!txt) { out.textContent = 'الرجاء كتابة نص للترجمة'; return; }
  out.textContent = 'جارٍ الترجمة...';
  try {
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(txt) + '&langpair=' + $('tPair').value);
    const d = await r.json();
    out.textContent = (d.responseData && d.responseData.translatedText) || 'تعذرت الترجمة';
  } catch (e) {
    out.textContent = 'تعذر الاتصال بخدمة الترجمة، تحقق من الإنترنت';
  }
}

let camStream = null, camTimer = null;
async function openCam() {
  const box = $('camBox'), v = $('camVideo'), msg = $('camMsg');
  box.style.display = 'flex';
  msg.textContent = 'جارٍ فتح الكاميرا...';
  if (!('BarcodeDetector' in window)) {
    msg.textContent = 'متصفحك لا يدعم المسح المباشر. استخدم Chrome محدّثاً.';
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    v.srcObject = camStream;
    await v.play();
    msg.textContent = 'وجّه الكاميرا نحو الكود...';
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    camTimer = setInterval(async () => {
      try {
        const codes = await det.detect(v);
        if (codes.length) {
          clearInterval(camTimer);
          msg.textContent = 'النتيجة: ' + codes[0].rawValue;
        }
      } catch (e) {}
    }, 300);
  } catch (e) {
    msg.textContent = 'تعذر فتح الكاميرا، تأكد من السماح بالإذن.';
  }
}
function closeCam() {
  clearInterval(camTimer);
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('camVideo').srcObject = null;
  $('camBox').style.display = 'none';
}

let flashTrack = null;
async function toggleFlash() {
  const b = $('flashBtn');
  try {
    if (!flashTrack) {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      flashTrack = s.getVideoTracks()[0];
      if (!flashTrack.getCapabilities().torch) {
        alert('فلاش الكاميرا غير مدعوم في هذا الجهاز');
        flashTrack.stop(); flashTrack = null; return;
      }
      await flashTrack.applyConstraints({ advanced: [{ torch: true }] });
      b.textContent = 'إيقاف الفلاش';
      b.style.background = '#ef4444';
    } else {
      flashTrack.stop(); flashTrack = null;
      b.textContent = 'تشغيل الفلاش';
      b.style.background = '';
    }
  } catch (e) { alert('تعذر الوصول إلى الفلاش، تأكد من إذن الكاميرا'); }
}

function startApp() {
  $('splash').classList.add('hide');
  $('home').style.display = 'block';
}

function openTool(n) {
  closeCam();
  $('home').style.display = 'none';
  $('tool').style.display = 'block';
  $('content').innerHTML = VIEWS[n].html;
  if (VIEWS[n].init) VIEWS[n].init();
  window.scrollTo(0, 0);
}

function goHome() {
  closeCam();
  $('tool').style.display = 'none';
  $('home').style.display = 'block';
}

$('grid').innerHTML = TOOLS.map(t =>
  `<div class="card ${t[5] ? 'wide' : ''}" style="--c:${t[4]}" onclick="openTool('${t[0]}')"><span class="ic">${t[1]}</span><div><b>${t[2]}</b><small>${t[3]}</small></div></div>`
).join('');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script>
<script src="./ai.js"></script>
<script src="./batch1.js"></script>
<script src="./qibla.js"></script>
</body>
</html>
